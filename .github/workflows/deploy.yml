name: Deploy MariosPizza

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Webhook
        run: |
          echo "🚀 Dispatching deployment..."
          
          # If we have SSH secrets configured, use them
          if [ ! -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "✅ SSH Key found, deploying via SSH..."
            
            mkdir -p ~/.ssh
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
            
            ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOFSH'
            set -e
            
            DEPLOY_PATH="/opt/stacks/mariospizza"
            
            echo "📥 Cloning/Updating repository..."
            if [ -d "$DEPLOY_PATH" ]; then
              cd "$DEPLOY_PATH"
              git fetch origin
              git reset --hard origin/main || git reset --hard origin/master || true
              git clean -fd
            else
              mkdir -p "$(dirname $DEPLOY_PATH)"
              git clone https://github.com/marioeduardo/mariospizza.git "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            fi
            
            echo "📦 Installing dependencies..."
            npm ci --only=production
            
            echo "🏗️  Building Docker image..."
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DEPLOY_PATH:/workdir" -w /workdir docker:cli compose down 2>/dev/null || true
            sleep 2
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DEPLOY_PATH:/workdir" -w /workdir docker:cli compose up -d --build
            
            echo "⏳ Waiting for application to start..."
            sleep 10
            
            echo "✅ Checking application health..."
            docker ps | grep mariospizza_app && echo "✅ Container is running"
            EOFSH
            
            # Reload Caddy
            ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "docker exec caddy caddy reload -c /etc/caddy/Caddyfile 2>/dev/null && echo '✅ Caddy reloaded' || true"
          else
            echo "⚠️  SSH_KEY not configured in GitHub Secrets"
            echo "Please add VPS_SSH_KEY to your repository secrets"
            echo "https://github.com/marioeduardo/mariospizza/settings/secrets/actions"
            exit 1
          fi

      - name: Deployment Success
        if: success()
        run: |
          echo "🎉 MariosPizza deployed successfully!"
          echo "🌐 URL: https://pizza.marioeduardo.com.br"
