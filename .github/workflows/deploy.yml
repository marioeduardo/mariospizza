name: Deploy MariosPizza

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOFSH'
          set -e
          
          DEPLOY_PATH="/opt/stacks/mariospizza"
          
          if [ -d "$DEPLOY_PATH" ]; then
            cd "$DEPLOY_PATH"
            git pull origin main 2>/dev/null || git pull origin master 2>/dev/null || true
          else
            git clone https://github.com/marioeduardo/mariospizza.git "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
          fi
          
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DEPLOY_PATH:/workdir" -w /workdir docker:cli compose down 2>/dev/null || true
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$DEPLOY_PATH:/workdir" -w /workdir docker:cli compose up -d --build
          
          sleep 5
          if curl -f http://localhost:3000 2>/dev/null; then
            echo "✅ Application is healthy"
          else
            echo "⚠️ Application may need time to start"
          fi
          EOFSH

      - name: Reload Caddy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "docker exec caddy caddy reload -c /etc/caddy/Caddyfile 2>/dev/null || true"

      - name: Deployment Success
        run: echo "🎉 MariosPizza deployed to https://pizza.marioeduardo.com.br"
